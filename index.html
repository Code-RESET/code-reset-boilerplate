<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Code-Reset App</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Code-Reset" />

<link rel="icon" href="assets/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="aviso-prueba" class="aviso-prueba" hidden></div>

<section id="error-fatal" class="error-fatal" hidden>
  <div>
    <h1>La app se detuvo</h1>
    <p id="error-fatal-texto"></p>
  </div>
</section>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen">
  <div class="login-card">
    <img src="assets/logo.svg" alt="Code-Reset" class="login-logo" />
    <h1 class="login-title">CODE-RESET</h1>
    <p class="login-subtitle" id="app-name-slot">Nombre de la app</p>

    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>Correo</span>
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error-text" hidden></p>
      <button type="submit" id="login-btn" class="btn-primary">Entrar</button>
    </form>

    <footer class="login-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </div>
</section>

<!-- ===================== SHELL DE LA APP ===================== -->
<section id="app-shell" class="screen" hidden>
  <header class="app-header">
    <img src="assets/logo.svg" alt="Code-Reset" class="header-logo" />
    <nav id="app-nav" class="app-nav"><!-- router.js pinta los links según los módulos registrados --></nav>
    <button id="logout-btn" class="btn-ghost">Salir</button>
  </header>

  <main id="app-content" class="app-content">
    <!-- router.js inyecta aquí la vista activa -->
  </main>
</section>

<!-- ===================== ERRORES VISIBLES ===================== -->
<button id="btn-errores" class="btn-errores" hidden></button>
<section id="errores-panel" class="errores-panel" hidden>
  <div class="errores-card">
    <h2>Errores registrados</h2>
    <p>Se guardan en este dispositivo (últimos 50).</p>
    <ul id="errores-lista"></ul>
    <div class="errores-acciones">
      <button id="errores-limpiar" class="btn-ghost">Limpiar</button>
      <button id="errores-cerrar" class="btn-primary">Cerrar</button>
    </div>
  </div>
</section>

<!-- errores.js va primero para detectar fallos desde el arranque -->
<script type="module" src="js/errores.js"></script>
<script type="module" src="js/auth.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.warn('Service worker no registrado:', err);
      });
    });
  }
</script>
</body>
</html>
